# 24 varied, topically diverse yes/no questions for `bioreservoir.live.validate_states` (see
# live-states.yaml's `validation_procedure`). Deliberately NOT drawn from questions.yaml (the 33
# pre-registered election questions) or reference.yaml (24 neutral, non-question statements) —
# this set exists to check whether a candidate behavioural-state population's spike rate actually
# varies with what text is shown, across a spread of everyday topics, not just neutral prose vs.
# one narrow subject. None of these touch moderation.py's blocked categories (voting procedure,
# medical, financial, private persons, violence, sexual) — this file is simulation input, not a
# moderation test fixture (see tests/test_moderation.py for that).
#
# Like reference.yaml/questions.yaml (see their own header comments), this file is committed and
# not edited in place: a wording correction lands as a new id.

