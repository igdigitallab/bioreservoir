# Handedness reference set (README.md "Handedness and side mapping"; oracle/reference.py).
#
# 24 short, neutral, non-predictive, non-political English sentences, written by hand for this
# experiment (not drawn from questions.yaml or any external corpus). Every (brain, condition) —
# real, rewired, er — and the no-brain baseline runs each sentence with the same encoder/trial
# settings as a real question; the mean lateral bias across all 24 sentences (and their trials)
# is that group's handedness b0 (oracle/handedness.py), subtracted from every question's raw bias
# before it becomes a probability.
#
# Like questions.yaml (see oracle/questions.py), this file is committed and not edited in place:
# a wording correction lands as a new id, so a previously-computed b0 is never silently redefined
# by mutating the sentence text underneath an id the ledger already has results for.

