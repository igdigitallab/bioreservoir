# Experiment 001 question set: 2026 US midterm elections (November 3, 2026).
#
# Selection criteria (see experiments/001-fly-oracle/README.md and questions.example.yaml
# for the schema): chamber control (House + Senate); every Senate race rated Toss-up or
# Lean by at least one of Cook Political Report / Sabato's Crystal Ball / Inside Elections
# as of mid-September 2026, plus the Florida and Ohio special elections and the Oklahoma and
# South Carolina races (regular elections held by appointed incumbents) regardless of rating;
# the top 8 governor races rated Toss-up/Lean by the same three raters; and 11 of
# the most competitive U.S. House races (all Cook Toss-ups as of September 11, 2026).
#
# No Kalshi/Polymarket/Manifold data was used anywhere; market_consensus is null throughout.
# All facts are sourced to official state/AP/Ballotpedia/Wikipedia/Cook/Sabato/Inside
# Elections pages, cross-checked against each other (see `sources` per question).
#
# Balance check (33 questions total: 13 Senate incl. control, 12 House incl. control, 8
# governor): of the 31 individual-race questions, 20 have a Republican incumbent party and
# 11 a Democratic incumbent party. This mirrors the 2026 map itself, not a selection choice:
# Republicans are defending 22 of the 35 Senate seats up this cycle (vs. 13 for Democrats),
# and among Cook's House Toss-ups only 5 of 21 are Democratic-held, all 5 of which are
# included here. The two chamber-control questions are tagged with the party currently
# holding the majority (Republican in both chambers).

# Variants (added 2026-09-18, before any run): `negation` replaces "hold" with "lose" (the exact
# complement under each resolution criterion); `paraphrase` rewords "party holds X" as "party's
# nominee wins X, keeping it under party control". Resolution criteria are unchanged.

- id: "2026-senate-control"
  format: scored
  category: politics
  question: "Will the Republican Party hold its majority in the United States Senate after the November 3, 2026 election?"
  negation: "Will the Republican Party lose its majority in the United States Senate after the November 3, 2026 election?"
  paraphrase: "After the November 3, 2026 election, will Republicans still control the United States Senate?"
  context: >-
    Republicans currently hold 53 of 100 Senate seats (Democrats 45, independents caucusing with
    Democrats 2); Vice President JD Vance, a Republican, breaks any 50-50 tie. Of the 35 seats up in
    2026, Republicans hold 22 (including the Florida and Ohio special elections) and Democrats hold
    13, so Republicans are defending far more ground. Cook Political Report rated 7 of the 35 races
    Toss-up as of September 15, 2026.
  resolves_by: "2026-12-15"
  resolution_criterion: >-
    Republicans are counted as holding the majority if they win at least 50 of the 100 seats for the
    120th Congress (the Vice President's tiebreak keeps a 50-50 Senate under Republican control);
    Democrats and independents who caucus with them are counted as holding the majority only if they
    win at least 51 seats. Based on the Associated Press's cumulative race calls once every 2026
    Senate race, including any runoffs, has been decided.
  resolution_source: "https://apnews.com/"
  market_consensus:
    value: null
    as_of: null
    source_url: null
  candidates: []
  incumbent_party: "Republican"
  rating:
    cook: null
    sabato: null
    inside: null
    as_of: "2026-09-15"
  sources:
    - "https://en.wikipedia.org/wiki/2026_United_States_Senate_elections"
    - "https://www.cookpolitical.com/ratings/senate-race-ratings"
  added: "2026-09-18"

